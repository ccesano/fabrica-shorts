name: Fabricar
# Cada guion nuevo o modificado en videos/<slug>/guion.json se convierte en video y queda esperando revisión (issue).
on:
  push:
    branches: [main]
    paths: ["videos/*/guion.json"]
  workflow_dispatch:
    inputs:
      slug:
        description: "Carpeta dentro de videos/ (ej. 2026-10-25-mundial-86)"
        required: true
      motor:
        description: "Motor de voz"
        default: chatterbox
        type: choice
        options: [chatterbox, kokoro]

permissions:
  contents: write
  issues: write

concurrency:
  group: fabricar
  cancel-in-progress: false

jobs:
  fabricar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ¿Qué videos hay que fabricar?
        id: cuales
        # Mira TODOS los commits de la subida (no solo el último): si llegan dos guiones juntos, se fabrican los dos.
        run: |
          antes="${{ github.event.before }}"
          if [ -n "${{ inputs.slug }}" ]; then s="${{ inputs.slug }}"
          else
            if [ -z "$antes" ] || [ "$antes" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$antes^{commit}" 2>/dev/null; then
              antes=$(git rev-parse HEAD^)
            fi
            s=$(git diff --name-only "$antes" HEAD -- 'videos/*/guion.json' | cut -d/ -f2 | sort -u \
                | while read -r x; do if [ -f "videos/$x/guion.json" ]; then echo "$x"; fi; done | tr '\n' ' ')
          fi
          echo "slugs=$s" >> "$GITHUB_OUTPUT"; echo "Videos: $s"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Caché de entornos (Python, HyperFrames)
        uses: actions/cache@v4
        with:
          path: |
            .venv
            .venv-voz
            ~/.local/share/uv
            ~/.npm
          key: entornos-v1-${{ runner.os }}-${{ hashFiles('setup.sh') }}
          restore-keys: entornos-v1-${{ runner.os }}-

      - name: Caché de instrumentos y modelos
        uses: actions/cache@v4
        with:
          path: |
            vendor
            modelos
            ~/.cache/huggingface
          key: pesados-v1-${{ hashFiles('setup.sh') }}
          restore-keys: pesados-v1-

      - name: Caché de voces ya generadas
        uses: actions/cache@v4
        with:
          path: .cache/voz
          key: voz-${{ github.sha }}
          restore-keys: voz-

      - name: Instalar
        run: |
          set -o pipefail
          bash setup.sh 2>&1 | tee setup.log
        env:
          VOZ_CLAVE: ${{ secrets.VOZ_CLAVE }}

      - name: Fabricar y subir para revisión
        id: fab
        # Cada video por separado: si uno falla, los demás igual se fabrican y llegan a revisión.
        run: |
          fallas=""
          for s in ${{ steps.cuales.outputs.slugs }}; do
            mkdir -p "videos/$s/salida"
            echo "::group::$s"
            if .venv/bin/python fabrica/make_short.py "videos/$s/guion.json" --motor "${{ inputs.motor || 'chatterbox' }}" 2>&1 | tee "videos/$s/salida/fabricar.log" \
               && bash .github/scripts/revision.sh "$s"; then
              echo "✅ $s"
            else
              echo "❌ $s"; fallas="$fallas $s"
            fi
            echo "::endgroup::"
          done
          echo "fallas=$fallas" >> "$GITHUB_OUTPUT"
          [ -z "$fallas" ]
        shell: bash -o pipefail {0}
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          GH_TOKEN: ${{ github.token }}

      - name: Avisar si falló
        if: failure()
        run: |
          malos="${{ steps.fab.outputs.fallas }}"; [ -n "$malos" ] || malos="${{ steps.cuales.outputs.slugs }}"
          log=$(for s in $malos; do echo "== $s"; tail -n 40 "videos/$s/salida/fabricar.log" 2>/dev/null; done)
          [ -n "$(echo "$log" | grep -v '^== ')" ] || log=$(tail -n 40 setup.log 2>/dev/null)
          gh label create falla --color B60205 --force >/dev/null
          gh issue create --label falla --title "Falló la fabricación:$malos" --body "$(printf 'Run: %s\n\n```\n%s\n```' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$log")"
        env:
          GH_TOKEN: ${{ github.token }}
